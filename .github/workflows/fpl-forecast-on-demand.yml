# Copy to .github/workflows/fpl-forecast-on-demand.yml only after release review.
# Inert here. Manual only; no schedule and no changes to the existing advisor.
name: FPL fixed-model forecast on demand

on:
  workflow_dispatch:
    inputs:
      model_directory:
        description: Reviewed model package folder
        required: true
        default: forecast-model
        type: string

permissions:
  contents: write

concurrency:
  group: fpl-forecast-on-demand-${{ github.ref }}
  cancel-in-progress: false

jobs:
  forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FPL_MODEL_DIR: ${{ inputs.model_directory }}
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Check the selected package folder
        run: |
          python - <<'PY'
          import os,re
          from pathlib import Path
          value=os.environ['FPL_MODEL_DIR']
          if not re.fullmatch(r'[A-Za-z0-9_-]+(?:/[A-Za-z0-9_-]+)*',value):
              raise SystemExit('Expected a plain relative package directory')
          root=Path.cwd().resolve();path=(root/value).resolve()
          if root not in path.parents or not (path/'manifest.json').is_file():
              raise SystemExit('Reviewed package manifest is missing')
          PY
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ${{ inputs.model_directory }}/requirements.lock.txt
      - name: Install the fixed inference runtime
        run: |
          python -m pip install -r "$FPL_MODEL_DIR/requirements.lock.txt"
          python -m pip install --no-deps -e "$FPL_MODEL_DIR"
      - name: Capture official data and forecast once
        run: fpl-forecast run --package-root "$FPL_MODEL_DIR" --output-dir run-output --workers 4 --max-capture-seconds 600
      - name: Validate and prepare bounded plaintext results
        run: python -m fpl_forecast.publish --package-root "$FPL_MODEL_DIR" --forecast-dir run-output/forecast --destination "$FPL_MODEL_DIR/latest"
      - name: Commit only generated forecast results
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python "$FPL_MODEL_DIR/scripts/commit_latest.py" --model-directory "$FPL_MODEL_DIR" --branch "$TARGET_BRANCH"
          echo "Pinned forecast commit: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
          echo "Results folder: $FPL_MODEL_DIR/latest/" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fpl-forecast-${{ github.run_id }}
          path: |
            run-output/forecast/
            run-output/run.json
          if-no-files-found: error
          retention-days: 14
