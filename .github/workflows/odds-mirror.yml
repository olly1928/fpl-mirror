name: Odds mirror

# Pulls bookmaker odds from The Odds API and writes data/odds.csv.
#
# Runs every six hours at :20 past — 01:20, 07:20, 13:20 and 19:20 UTC —
# deliberately offset from the hourly FPL mirror so the two jobs never try to
# push at the same minute.
#
# It used to run twice a day, and that was not enough. GitHub's scheduler is
# best effort: these runs landed 25 to 120 minutes late, and one was dropped
# entirely, which on a two-a-day schedule left a 23-hour hole ending the evening
# before a deadline. Four runs a day means a dropped one costs six hours instead
# of twelve, and the extra pulls land close enough to a deadline to catch team
# news. ODDS_INTERVAL_MINUTES in build_odds.py must stay in step with this cron.
#
# Cost is 2 API credits per run (2 markets x 1 region), so 8 a day and about 248
# a month — inside the 500-a-month free tier with room for manual re-runs.
# Needs the ODDS_API_KEY repository secret: gh secret set ODDS_API_KEY
# Without it the job fails loudly rather than writing an empty file.

on:
  schedule:
    - cron: '20 1,7,13,19 * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: odds-mirror
  cancel-in-progress: false

jobs:
  odds:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so the rebase below has something to rebase onto —
          # the hourly FPL mirror commits often enough to land mid-run.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          # Pinned to an exact patch, same reasoning as the FPL mirror.
          python-version: '3.12.7'

      - name: Build odds.csv
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python build_odds.py

      - name: Commit if anything changed
        run: |
          git config user.name  "fpl-mirror"
          git config user.email "actions@github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "no changes"
            exit 0
          fi
          git commit -m "Odds $(date -u +%Y-%m-%dT%H:%M)"
          # The hourly job may have pushed while we were fetching odds.
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push

      # Same reasoning as the FPL mirror: default failure email is easy to miss,
      # an issue is not. Reuses one issue rather than opening a new one per run.
      - name: Report failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          TITLE="Odds mirror is failing"
          EXISTING=$(gh issue list --state open --label mirror-failure --search "$TITLE" \
                       --json number --jq '.[0].number' || true)
          BODY="The odds mirror failed at $(date -u +%Y-%m-%dT%H:%MZ).

          Run: $RUN_URL

          Most likely causes, in order: the monthly Odds API credit allowance is
          exhausted (HTTP 429), ODDS_API_KEY is missing or rejected (HTTP 401), or
          the response shape moved and no event produced a row. The previous
          data/odds.csv is untouched either way."
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "$BODY"
          else
            gh label create mirror-failure --color d73a4a \
              --description "A scheduled mirror run failed" 2>/dev/null || true
            gh issue create --title "$TITLE" --label mirror-failure --body "$BODY"
          fi
