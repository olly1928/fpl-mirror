name: Historical FPL research

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.7'
      - name: Reproduce chronological research from committed raw data
        run: bash history/run_research.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fpl-research-${{ github.run_id }}
          path: history/work/research/
          retention-days: 90
