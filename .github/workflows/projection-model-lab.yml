name: Projection model research

on:
  push:
    branches: [research/broad-projection-models]
    paths: [research/run-request.json]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: projection-model-research-${{ github.ref }}
  cancel-in-progress: false

env:
  OMP_NUM_THREADS: '2'
  OPENBLAS_NUM_THREADS: '1'
  MPLBACKEND: Agg

jobs:
  features:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.7'
          cache: pip
          cache-dependency-path: research/requirements.txt
      - run: python -m pip install -r research/requirements.txt
      - name: Check adversarial chronology tests
        run: python -m unittest research.test_research
      - name: Prepare immutable historical and deadline inputs
        run: |
          python history/unpack.py --output research/work/source
          python backtests/acquire.py --scope current --output research/work/replay-inputs
          python -m research.prepare --current research/work/replay-inputs/raw/current-core --actuals research/work/replay-inputs/outcomes/player_history.csv
          cd research/work/features
          sha256sum historical.pkl current.pkl feature-manifest.json current-source-manifest.json > cache.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: model-feature-cache
          path: |
            research/work/features/historical.pkl
            research/work/features/current.pkl
            research/work/features/feature-manifest.json
            research/work/features/current-source-manifest.json
            research/work/features/cache.sha256
          retention-days: 1
          compression-level: 4

  fit:
    needs: features
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        year: [2016, 2017, 2018, 2019, 2020, 2021, 2022, 2023, 2024, 2025]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.7'
          cache: pip
          cache-dependency-path: research/requirements.txt
      - run: python -m pip install -r research/requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: model-feature-cache
          path: research/work/features
      - run: cd research/work/features && sha256sum -c cache.sha256
      - name: Fit every declared one-week candidate on earlier seasons
        run: python -m research.experiment --first-year ${{ matrix.year }} --last-year ${{ matrix.year }} --jobs 2
      - name: Fit purged six-week candidates
        run: python -m research.six_week --first-year ${{ matrix.year }} --last-year ${{ matrix.year }} --fit-only --jobs 2
      - name: Assemble inspectable fold evidence
        run: |
          mkdir -p research/fold-results/one-week research/fold-results/six-week
          cp research/work/experiments/${{ matrix.year }}/* research/fold-results/one-week/
          cp research/work/experiments/experiment.json research/fold-results/experiment.json
          cp research/work/six-week/${{ matrix.year }}/* research/fold-results/six-week/
          cp research/work/six-week/coverage.json research/fold-results/six-week-coverage.json
          cp research/work/six-week/experiment.json research/fold-results/six-week-experiment.json
          python - <<'PY'
          import pathlib, pandas as pd
          path=pathlib.Path('research/fold-results/one-week/targets.pkl')
          pd.read_pickle(path).to_csv(path.with_name('targets.csv.gz'),index=False,compression={'method':'gzip','mtime':0})
          path.unlink()
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: fold-${{ matrix.year }}
          path: research/fold-results
          retention-days: 1
          compression-level: 4

  collect:
    needs: [features, fit]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/broad-projection-models
      - uses: actions/download-artifact@v4
        with:
          pattern: fold-*
          path: research/results/folds
      - uses: actions/download-artifact@v4
        with:
          name: model-feature-cache
          path: /tmp/model-feature-cache
      - name: Retain manifests and experiment provenance
        run: |
          cp /tmp/model-feature-cache/feature-manifest.json research/results/feature-manifest.json
          cp /tmp/model-feature-cache/current-source-manifest.json research/results/current-source-manifest.json
          python - <<'PY'
          import json,os,pathlib
          root=pathlib.Path('research/results')
          trials=list(root.glob('folds/fold-*/one-week/*-seed1729.json'))
          records=[json.loads(p.read_text()) for p in trials]
          if len(records)!=790 or any(r['status']!='ok' for r in records):
              raise SystemExit('Incomplete or failed declared trial set')
          (root/'workflow-run.json').write_text(json.dumps({'run_id':os.environ['GITHUB_RUN_ID'],'source_commit':os.environ['GITHUB_SHA'],'trials':len(records),'live_model_changed':False},indent=2)+'\n')
          PY
      - name: Commit evidence on the research branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/results
          git commit -m 'Retain chronological projection-model trial evidence'
          git push origin HEAD:research/broad-projection-models
