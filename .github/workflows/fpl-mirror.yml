name: FPL mirror

# Refreshes the data twice a day and commits it to the repo.
# No secrets needed — the FPL API is public.

on:
  schedule:
    - cron: '0 * * * *'      # 06:00 and 18:00 UTC
  workflow_dispatch:             # lets you trigger it by hand

permissions:
  contents: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build CSVs from the FPL API
        run: python build_fpl.py

      - name: Mirror my squad
        run: python build_squad.py

      - name: Commit if anything changed
        run: |
          git config user.name  "fpl-mirror"
          git config user.email "actions@github.com"
          git add data/
          git diff --staged --quiet || git commit -m "FPL data $(date -u +%Y-%m-%dT%H:%M)"
          git push
