[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fpl-forecast-model"
version = "2.0.0"
description = "On-demand FPL forecasts from a fixed qualified model procedure"
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy==2.2.6", "pandas==2.2.3", "scipy==1.14.1",
  "scikit-learn==1.6.1", "joblib==1.6.0", "threadpoolctl==3.6.0",
  "pyarrow==19.0.1", "lightgbm==4.6.0", "xgboost==3.0.2", "catboost==1.2.8",
]

[project.scripts]
fpl-forecast = "fpl_forecast.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
